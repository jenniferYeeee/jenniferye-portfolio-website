<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>Rapid Product Alerts: system design</title><rect width="1200" height="620" fill="#faf8f5"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b635a"/></marker></defs><rect x="20" y="20" width="280" height="580" rx="18" fill="#f1ede6"/><text x="40" y="50" font-size="14" font-weight="600" fill="#5f5850">Mercury admins</text><rect x="320" y="20" width="580" height="580" rx="18" fill="#f1ede6"/><text x="340" y="50" font-size="14" font-weight="600" fill="#5f5850">Rapid Product Alerts</text><rect x="920" y="20" width="260" height="580" rx="18" fill="#f1ede6"/><text x="940" y="50" font-size="14" font-weight="600" fill="#5f5850">Mercury customers</text><rect x="45" y="80" width="230" height="140" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="160.0" y="126.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Author</text><text x="160.0" y="145.5" text-anchor="middle" font-size="13" fill="#5f5850">admin dashboard:</text><text x="160.0" y="164.5" text-anchor="middle" font-size="13" fill="#5f5850">banner, call to action,</text><text x="160.0" y="183.5" text-anchor="middle" font-size="13" fill="#5f5850">schedule, CSV audience</text><rect x="45" y="400" width="230" height="140" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="160.0" y="456.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Second admin</text><text x="160.0" y="475.0" text-anchor="middle" font-size="13" fill="#5f5850">compares current vs.</text><text x="160.0" y="494.0" text-anchor="middle" font-size="13" fill="#5f5850">proposed, then approves</text><rect x="350" y="80" width="520" height="120" rx="12" fill="#e9e4dc" stroke="#d9d2c7" stroke-width="1.5"/><text x="610.0" y="126.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Alerts API</text><text x="610.0" y="145.0" text-anchor="middle" font-size="13" fill="#5f5850">validates every field, shows a live preview,</text><text x="610.0" y="164.0" text-anchor="middle" font-size="13" fill="#5f5850">keeps each version and its audit history</text><rect x="360" y="270" width="90" height="44" rx="22" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="405.0" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1d1a">Draft</text><rect x="480" y="270" width="130" height="44" rx="22" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="545.0" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1d1a">Under review</text><rect x="640" y="270" width="100" height="44" rx="22" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="690.0" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1d1a">Active</text><rect x="770" y="270" width="100" height="44" rx="22" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="820.0" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1d1a">Expired</text><path d="M 450 292 L 480 292" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="465" y="338" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">submit</text><path d="M 610 292 L 640 292" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 740 292 L 770 292" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="755" y="338" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">end time</text><rect x="350" y="400" width="260" height="140" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="480.0" y="456.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Slack</text><text x="480.0" y="475.0" text-anchor="middle" font-size="13" fill="#5f5850">asks reviewers to approve</text><text x="480.0" y="494.0" text-anchor="middle" font-size="13" fill="#5f5850">and links to the change</text><rect x="645" y="400" width="225" height="140" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="757.5" y="437.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Approval rules</text><text x="757.5" y="456.0" text-anchor="middle" font-size="13" fill="#5f5850">authors can&#x27;t approve</text><text x="757.5" y="475.0" text-anchor="middle" font-size="13" fill="#5f5850">their own alerts;</text><text x="757.5" y="494.0" text-anchor="middle" font-size="13" fill="#5f5850">every alert ends at its</text><text x="757.5" y="513.0" text-anchor="middle" font-size="13" fill="#5f5850">scheduled end time</text><rect x="945" y="230" width="210" height="140" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="1050.0" y="276.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Customer app</text><text x="1050.0" y="295.5" text-anchor="middle" font-size="13" fill="#5f5850">shows the banner to</text><text x="1050.0" y="314.5" text-anchor="middle" font-size="13" fill="#5f5850">the targeted organizations</text><text x="1050.0" y="333.5" text-anchor="middle" font-size="13" fill="#5f5850">while it&#x27;s active</text><path d="M 275 150 L 350 150" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="312" y="141" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">create / edit</text><path d="M 545 314 L 545 365 L 480 365 L 480 400" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="512" y="357" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">notify</text><path d="M 350 470 L 275 470" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="312" y="461" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">review request</text><path d="M 275 510 L 300 510 L 300 580 L 627 580 L 627 330 L 665 330 L 665 314" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="465" y="572" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">approve</text><path d="M 405 200 L 405 270" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="417" y="240" text-anchor="start" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">saved as a draft</text><path d="M 700 270 L 700 235 L 905 235 L 905 300 L 945 300" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="805" y="227" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">publish</text></svg>
