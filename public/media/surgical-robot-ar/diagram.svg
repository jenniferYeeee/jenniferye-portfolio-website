<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>AR guidance for surgical robot: system design</title><rect width="1200" height="650" fill="#faf8f5"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b635a"/></marker></defs><rect x="20" y="20" width="1160" height="230" rx="18" fill="#f1ede6"/><text x="40" y="50" font-size="14" font-weight="600" fill="#5f5850">HoloLens 2, worn by the surgeon</text><rect x="20" y="290" width="1160" height="340" rx="18" fill="#f1ede6"/><text x="1160" y="320" text-anchor="end" font-size="14" font-weight="600" fill="#5f5850">Windows host with GPU</text><rect x="60" y="80" width="230" height="120" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="175.0" y="126.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Sensors</text><text x="175.0" y="145.0" text-anchor="middle" font-size="13" fill="#5f5850">Front RGB camera</text><text x="175.0" y="164.0" text-anchor="middle" font-size="13" fill="#5f5850">Long-throw depth sensor</text><rect x="520" y="90" width="210" height="80" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="625.0" y="125.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Target position</text><text x="625.0" y="144.5" text-anchor="middle" font-size="13" fill="#5f5850">from the interfacing system</text><rect x="800" y="65" width="350" height="160" rx="12" fill="#e9e4dc" stroke="#d9d2c7" stroke-width="1.5"/><text x="975.0" y="121.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Unity app (MRTK)</text><text x="975.0" y="140.5" text-anchor="middle" font-size="13" fill="#5f5850">Phantom Micromate overlay</text><text x="975.0" y="159.5" text-anchor="middle" font-size="13" fill="#5f5850">Arrow from arm tip to target</text><text x="975.0" y="178.5" text-anchor="middle" font-size="13" fill="#5f5850">Turns green within 5 cm: “Aligned”</text><rect x="60" y="370" width="200" height="90" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="160.0" y="410.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">RGB-D frames</text><text x="160.0" y="429.5" text-anchor="middle" font-size="13" fill="#5f5850">1080p, aligned</text><rect x="300" y="345" width="230" height="140" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="415.0" y="401.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">First frame only</text><text x="415.0" y="420.0" text-anchor="middle" font-size="13" fill="#5f5850">YOLOv8 finds the Micromate</text><text x="415.0" y="439.0" text-anchor="middle" font-size="13" fill="#5f5850">SAM cuts a precise mask</text><rect x="570" y="345" width="270" height="140" rx="12" fill="#e9e4dc" stroke="#d9d2c7" stroke-width="1.5"/><text x="705.0" y="391.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">FoundationPose</text><text x="705.0" y="410.5" text-anchor="middle" font-size="13" fill="#5f5850">Register: first-frame pose</text><text x="705.0" y="429.5" text-anchor="middle" font-size="13" fill="#5f5850">Track: every next frame</text><text x="705.0" y="448.5" text-anchor="middle" font-size="13" fill="#5f5850">refine_iter = 10 to stop drift</text><rect x="880" y="375" width="200" height="80" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="980.0" y="410.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">6-DoF pose</text><text x="980.0" y="429.5" text-anchor="middle" font-size="13" fill="#5f5850">of the Micromate</text><rect x="560" y="530" width="180" height="70" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5" stroke-dasharray="5 4"/><text x="650.0" y="560.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">CAD mesh</text><text x="650.0" y="579.5" text-anchor="middle" font-size="13" fill="#5f5850">iPhone 3D scan, meters</text><rect x="770" y="530" width="180" height="70" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5" stroke-dasharray="5 4"/><text x="860.0" y="570.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Camera intrinsics</text><path d="M 140 200 L 140 370" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="152" y="274" text-anchor="start" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#faf8f5" stroke-width="5" stroke-linejoin="round">hl2ss stream over Wi-Fi</text><path d="M 260 415 L 300 415" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 530 415 L 570 415" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550" y="405" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">mask</text><path d="M 230 370 L 230 330 L 620 330 L 620 345" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="322" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">every frame</text><path d="M 840 415 L 880 415" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 980 375 L 980 225" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="968" y="274" text-anchor="end" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#faf8f5" stroke-width="5" stroke-linejoin="round">pose to headset</text><path d="M 730 130 L 800 130" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 650 530 L 650 485" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 800 530 L 800 485" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="60" y="626" text-anchor="start" font-size="12" font-weight="400" fill="#5f5850">Dashed: prepared once, ahead of time.</text></svg>
