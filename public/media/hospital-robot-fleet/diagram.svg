<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><title>Door API integration in Mayo Clinic: system design</title><rect width="1200" height="600" fill="#faf8f5"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b635a"/></marker></defs><rect x="20" y="20" width="270" height="560" rx="18" fill="#f1ede6"/><text x="40" y="50" font-size="14" font-weight="600" fill="#5f5850">On the robot</text><rect x="310" y="20" width="590" height="560" rx="18" fill="#f1ede6"/><text x="330" y="50" font-size="14" font-weight="600" fill="#5f5850">Collaborative Robotics cloud</text><rect x="920" y="20" width="260" height="560" rx="18" fill="#f1ede6"/><text x="940" y="50" font-size="14" font-weight="600" fill="#5f5850">Mayo Clinic</text><rect x="45" y="90" width="220" height="110" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="155.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Proxie</text><text x="155.0" y="150.0" text-anchor="middle" font-size="13" fill="#5f5850">drives its route through</text><text x="155.0" y="169.0" text-anchor="middle" font-size="13" fill="#5f5850">the hospital map</text><rect x="340" y="90" width="240" height="110" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="460.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Location reporting</text><text x="460.0" y="150.0" text-anchor="middle" font-size="13" fill="#5f5850">service</text><text x="460.0" y="169.0" text-anchor="middle" font-size="13" fill="#5f5850">tracks where each robot is</text><rect x="640" y="90" width="230" height="110" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="755.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Door zone</text><text x="755.0" y="150.0" text-anchor="middle" font-size="13" fill="#5f5850">e.g. floor/1/door_23</text><text x="755.0" y="169.0" text-anchor="middle" font-size="13" fill="#5f5850">knows which devices are inside</text><rect x="340" y="270" width="530" height="260" rx="12" fill="#e9e4dc" stroke="#d9d2c7" stroke-width="1.5"/><text x="605.0" y="405.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a"></text><text x="605" y="302" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Door API service</text><text x="605" y="322" text-anchor="middle" font-size="13" fill="#5f5850">event-driven Java / Spring Boot, infrastructure as code</text><rect x="365" y="345" width="225" height="150" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="477.5" y="396.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Request orchestration</text><text x="477.5" y="415.5" text-anchor="middle" font-size="13" fill="#5f5850">opens the right door</text><text x="477.5" y="434.5" text-anchor="middle" font-size="13" fill="#5f5850">retries and timeouts</text><text x="477.5" y="453.5" text-anchor="middle" font-size="13" fill="#5f5850">handles failures</text><rect x="620" y="345" width="225" height="150" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="732.5" y="396.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Vendor adapters</text><text x="732.5" y="415.5" text-anchor="middle" font-size="13" fill="#5f5850">one shared interface</text><text x="732.5" y="434.5" text-anchor="middle" font-size="13" fill="#5f5850">one adapter per</text><text x="732.5" y="453.5" text-anchor="middle" font-size="13" fill="#5f5850">door vendor</text><rect x="945" y="270" width="210" height="110" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="1050.0" y="311.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Door system API</text><text x="1050.0" y="330.0" text-anchor="middle" font-size="13" fill="#5f5850">the hospital&#x27;s</text><text x="1050.0" y="349.0" text-anchor="middle" font-size="13" fill="#5f5850">access control</text><rect x="945" y="430" width="210" height="100" rx="12" fill="#ffffff" stroke="#d9d2c7" stroke-width="1.5"/><text x="1050.0" y="475.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1f1d1a">Door</text><text x="1050.0" y="494.5" text-anchor="middle" font-size="13" fill="#5f5850">opens for the robot</text><path d="M 265 145 L 340 145" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="302" y="136" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">position</text><path d="M 580 145 L 640 145" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="610" y="118" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">address</text><text x="610" y="134" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">update</text><path d="M 755 200 L 755 240 L 395 240 L 395 345" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="575" y="232" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">device inside the zone: open the door</text><path d="M 590 420 L 620 420" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 845 360 L 945 360" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="895" y="385" text-anchor="middle" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">OAuth + mTLS</text><path d="M 1050 380 L 1050 430" fill="none" stroke="#6b635a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1062" y="410" text-anchor="start" font-size="12.5" fill="#5f5850" paint-order="stroke" stroke="#f1ede6" stroke-width="5" stroke-linejoin="round">unlock</text><text x="45" y="236" text-anchor="start" font-size="12.5" font-weight="400" fill="#5f5850">Robot only reports where</text><text x="45" y="253" text-anchor="start" font-size="12.5" font-weight="400" fill="#5f5850">it is. The cloud decides</text><text x="45" y="270" text-anchor="start" font-size="12.5" font-weight="400" fill="#5f5850">when a door should open.</text></svg>
